<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Webcam — Clean view</title>
<style>
  html, body { margin:0; height:100%; background:#000; }
  body { display:flex; align-items:center; justify-content:center; }
  img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
</style>
  <link rel="stylesheet" href="/theme.css" />
</head>
<body>
<img id="feed" alt="camera feed" />
<script>
  // Full-screen, chrome-free view of the same MJPEG stream (pick the camera in
  // the controller). Resolved relative to this page so it works under the hub mount.
  const BASE = location.pathname.replace(/\/[^/]*$/, '/');
  const feed = document.getElementById('feed');
  const start = () => { feed.src = BASE + 'api/stream?t=' + Date.now(); };
  feed.onerror = () => setTimeout(start, 1000);
  start();
</script>
</body>
</html>
