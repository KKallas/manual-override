; M5Stack AtomS3R — web image server (128x128 RGB565)
; https://docs.m5stack.com/en/core/AtomS3R
;
; The AtomS3R is an ESP32-S3 (8 MB flash) with a 0.85" 128x128 IPS panel.
; PlatformIO has no dedicated atoms3r board, but the atoms3 board shares the
; same MCU/flash and M5Unified auto-detects the actual panel at runtime.

[env:atoms3r]
platform = espressif32@^6.5.0
board = m5stack-atoms3
framework = arduino

monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; serial console over the native USB-C port

lib_deps =
    m5stack/M5Unified@^0.2.0
